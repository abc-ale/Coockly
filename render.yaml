services:
  - type: web
    name: cookly-api
    runtime: docker
    plan: free
    rootDir: cookly-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/salud
    envVars:
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_DATABASE_USERNAME
        sync: false
      - key: SUPABASE_DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRETO
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://yvqepahrartbffphzrdh.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false