spring:
  profiles:
    default: local

  datasource:
    url: ${SUPABASE_DATABASE_URL}
    username: ${SUPABASE_DATABASE_USERNAME}
    password: ${SUPABASE_DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        prepareThreshold: "0"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

seguridad:
  jwt:
    secreto: ${JWT_SECRETO}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}

cloudinary:
  nombre: ${CLOUDINARY_CLOUD_NAME}
  clave-api: ${CLOUDINARY_API_KEY}
  secreto: ${CLOUDINARY_API_SECRET}

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}

app:
  url-publica: ${APP_URL_PUBLICA:https://cookly-api-sb9w.onrender.com}

brevo:
  api-key: ${BREVO_API_KEY:}
  remitente: ${BREVO_SENDER_EMAIL:}
  nombre-remitente: ${BREVO_SENDER_NAME:Cookly}