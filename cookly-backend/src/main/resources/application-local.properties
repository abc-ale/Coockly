# Credenciales locales: completa los valores sin subir este archivo a Git.
# Copia la URL y usuario desde Supabase > Connect > Connection pooling.
spring.datasource.url=jdbc:postgresql://TU_HOST_POOLER_SUPABASE:6543/postgres?sslmode=require
spring.datasource.username=TU_USUARIO_POOLER_SUPABASE
spring.datasource.password=TU_CONTRASENA_SUPABASE
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP: valores apropiados para el pooler de Supabase.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# El esquema se administra por los scripts de base-datos-supabase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

seguridad.jwt.secreto=CAMBIA_ESTA_CLAVE_POR_UNA_DE_MINIMO_32_CARACTERES
cloudinary.nombre=TU_CLOUD_NAME
cloudinary.clave-api=TU_API_KEY
cloudinary.secreto=TU_API_SECRET
